<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <marker id="sarr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ec9b0"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="url(#sbg)" rx="12"/>
  <text x="500" y="36" font-size="24" font-weight="bold" text-anchor="middle" fill="#fff" font-family="sans-serif">Benchmark Sandbox</text>
  <text x="500" y="58" font-size="13" text-anchor="middle" fill="#888" font-family="sans-serif">Isolated, fail-closed, versioned — benchmarks run here, not in the repo</text>

  <g font-family="sans-serif">
    <!-- Inputs -->
    <rect x="40" y="90" width="200" height="140" rx="8" fill="#1a1a2e" stroke="#4ec9b0" stroke-width="2"/>
    <text x="140" y="118" font-size="14" font-weight="bold" text-anchor="middle" fill="#4ec9b0">INPUTS</text>
    <text x="140" y="142" font-size="11" text-anchor="middle" fill="#aaa">prompts.json</text>
    <text x="140" y="160" font-size="11" text-anchor="middle" fill="#aaa">6 versioned prompts</text>
    <text x="140" y="178" font-size="11" text-anchor="middle" fill="#aaa">config.json</text>
    <text x="140" y="196" font-size="11" text-anchor="middle" fill="#aaa">resource limits</text>

    <!-- Runner -->
    <rect x="300" y="90" width="200" height="140" rx="8" fill="#4ec9b0"/>
    <text x="400" y="118" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">RUNNER</text>
    <text x="400" y="142" font-size="11" text-anchor="middle" fill="#000">sandbox/run.py</text>
    <text x="400" y="160" font-size="11" text-anchor="middle" fill="#000">SHA256 check</text>
    <text x="400" y="178" font-size="11" text-anchor="middle" fill="#000">RAM check</text>
    <text x="400" y="196" font-size="11" text-anchor="middle" fill="#000">Timeout enforced</text>

    <!-- Outputs -->
    <rect x="560" y="90" width="200" height="140" rx="8" fill="#1a1a2e" stroke="#4ec9b0" stroke-width="2"/>
    <text x="660" y="118" font-size="14" font-weight="bold" text-anchor="middle" fill="#4ec9b0">OUTPUTS</text>
    <text x="660" y="142" font-size="11" text-anchor="middle" fill="#aaa">outputs/ (gitignored)</text>
    <text x="660" y="160" font-size="11" text-anchor="middle" fill="#aaa">JSON reports</text>
    <text x="660" y="178" font-size="11" text-anchor="middle" fill="#aaa">Pass/fail per case</text>
    <text x="660" y="196" font-size="11" text-anchor="middle" fill="#aaa">Never in repo</text>

    <!-- Guards -->
    <rect x="800" y="90" width="160" height="140" rx="8" fill="#e94560"/>
    <text x="880" y="118" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">FAIL-CLOSED</text>
    <text x="880" y="142" font-size="11" text-anchor="middle" fill="#fff">Missing model → exit 2</text>
    <text x="880" y="160" font-size="11" text-anchor="middle" fill="#fff">Bad SHA → exit 2</text>
    <text x="880" y="178" font-size="11" text-anchor="middle" fill="#fff">Low RAM → exit 3</text>
    <text x="880" y="196" font-size="11" text-anchor="middle" fill="#fff">No inference runs</text>

    <line x1="240" y1="160" x2="295" y2="160" stroke="#4ec9b0" stroke-width="3" marker-end="url(#sarr)"/>
    <line x1="500" y1="160" x2="555" y2="160" stroke="#4ec9b0" stroke-width="3" marker-end="url(#sarr)"/>
  </g>

  <text x="500" y="270" font-size="12" text-anchor="middle" fill="#aaa" font-family="monospace">python3 sandbox/run.py --runtime /path/to/llama-cli --model models/mellum-E8-experimental.gguf</text>
  <text x="500" y="295" font-size="11" text-anchor="middle" fill="#666" font-family="sans-serif">4 coding prompts → substring checks + Python syntax validation via compile()</text>
  <text x="500" y="320" font-size="11" text-anchor="middle" fill="#666" font-family="sans-serif">Scope: smoke-level. NOT HumanEval. NOT MBPP. Honest about limits.</text>
</svg>
